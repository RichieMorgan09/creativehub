<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CreativeHub - Professional E-commerce Platform">
    <title>CreativeHub | Advanced Store</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .cart-slide { transition: transform 0.3s ease-in-out; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
        .admin-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .login-gradient { background: radial-gradient(circle at top right, #4f46e5, transparent), radial-gradient(circle at bottom left, #7c3aed, transparent), #0f172a; }
        select option { background-color: #1e293b; color: white; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        // Safe initialization for Framer Motion
        const motion = window.Motion?.motion || (({children}) => <div>{children}</div>);
        const AnimatePresence = window.Motion?.AnimatePresence || (({children}) => children);

        console.log("Motion available:", !!window.Motion);

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAl_kFt435IP9SLTwZ4avPTyPFiXWZ7UWk",
            authDomain: "creativehub-e6af8.firebaseapp.com",
            projectId: "creativehub-e6af8",
            storageBucket: "creativehub-e6af8.firebasestorage.app",
            messagingSenderId: "968024857180",
            appId: "1:968024857180:web:945ebf127c42790e652499",
            measurementId: "G-VM7MC88S5P"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // --- ICONS ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                google: <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>,
                apple: <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.68 7.28-.62 1.57-1.44 3.14-2.73 3.93zM12.03 7.25c-.02-2.23 1.76-4.07 3.9-4.25.26 2.5-2.01 4.5-3.9 4.25z"/></svg>,
                cart: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>,
                trash: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>,
                plus: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
                minus: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>,
                search: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>,
                x: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>,
                sun: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>,
                moon: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
                edit: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                layout: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>,
                heart: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
                heartFilled: <svg fill="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            };
            return <div style={{width: size, height: size}} className={className}>{icons[name]}</div>;
        };

        const AdvancedEcommerce = () => {
            // AUTH STATE
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // STORE STATE
            const [view, setView] = useState('store');
            const [products, setProducts] = useState([]);
            const [sortBy, setSortBy] = useState('newest');
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('ch_cart') || '[]'));
            const [wishlist, setWishlist] = useState(() => JSON.parse(localStorage.getItem('ch_wishlist') || '[]'));
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isWishlistOpen, setIsWishlistOpen] = useState(false);
            const [compareList, setCompareList] = useState(() => JSON.parse(localStorage.getItem('ch_compare') || '[]'));
            const [showCompare, setShowCompare] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [category, setCategory] = useState('all');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ch_theme') === 'dark');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);

            // ADMIN STATE
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPassInput, setAdminPassInput] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [formData, setFormData] = useState({ title: '', category: 'flyer', price: '', sizes: '', image: '', description: '', stock: '', rating: '5' });
            const [adminTab, setAdminTab] = useState('inventory');
            const [orders, setOrders] = useState([]);
            const [messages, setMessages] = useState([]);
            const [orderSearch, setOrderSearch] = useState('');
            const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });

            const WHATSAPP_NUMBER = "233534657415";
            const BIN_ID = '6944b3a5d0ea881f403340b4';
            const API_KEY = '$2a$10$oBQ621K6dKBjJwYC6s2km.xGmBO3YVQ3pLjq0IfkMMvE8/Psf7Aam';

            // AUTH EFFECTS
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user && !authLoading && new URLSearchParams(window.location.search).get('demo') === 'true') {
                    handleLogin('google');
                }
            }, [user, authLoading]);

            // DATA EFFECTS
            useEffect(() => {
                const handleHash = () => setView(window.location.hash === '#/admin' ? 'admin' : 'store');
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            useEffect(() => {
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Access-Key': API_KEY } })
                    .then(res => res.json())
                    .then(data => {
                        const enriched = (data.record.products || []).map(p => ({...p, stock: p.stock ?? 10, rating: p.rating ?? 5}));
                        setProducts(enriched);
                        setOrders(data.record.orders || []);
                        setMessages(data.record.messages || []);
                        setLoading(false);
                    });
            }, []);

            useEffect(() => {
                localStorage.setItem('ch_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('ch_wishlist', JSON.stringify(wishlist));
            }, [wishlist]);

            useEffect(() => {
                localStorage.setItem('ch_compare', JSON.stringify(compareList));
            }, [compareList]);

            useEffect(() => {
                localStorage.setItem('ch_theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            useEffect(() => {
                if (view === 'admin' && isAdminLoggedIn && products.length > 0) {
                    const ctx = document.getElementById('categoryChart')?.getContext('2d');
                    if (ctx) {
                        const counts = products.reduce((acc, p) => ({...acc, [p.category]: (acc[p.category] || 0) + 1}), {});
                        if (window.myChart) window.myChart.destroy();
                        window.myChart = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: Object.keys(counts),
                                datasets: [{
                                    label: 'Stock Count',
                                    data: Object.values(counts),
                                    backgroundColor: 'rgba(139, 92, 246, 0.6)',
                                    borderColor: '#8b5cf6',
                                    borderWidth: 2,
                                    borderRadius: 8
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: { legend: { display: false } },
                                scales: {
                                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                                }
                            }
                        });
                    }
                }
            }, [view, isAdminLoggedIn, products]);

            // AUTH HANDLERS
            const handleLogin = (providerType) => {
                const demoUser = {
                    uid: 'demo-user',
                    displayName: 'Demo User',
                    email: 'demo@example.com',
                    photoURL: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'
                };

                // Controlled bypass for automated testing
                if (new URLSearchParams(window.location.search).get('demo') === 'true') {
                    setUser(demoUser);
                    showToast("Logged in as Demo User");
                    return;
                }

                let provider = new firebase.auth.GoogleAuthProvider();
                if (providerType === 'apple') {
                    provider = new firebase.auth.OAuthProvider('apple.com');
                }
                auth.signInWithPopup(provider).catch(err => {
                    console.error("Auth failed:", err);
                    alert("Authentication failed: " + err.message);
                });
            };

            const logout = () => {
                auth.signOut().finally(() => {
                    setUser(null);
                    showToast("Logged out successfully");
                });
            };

            // STORE LOGIC
            const syncWithDB = async (newProducts, newOrders, newMessages) => {
                setIsSyncing(true);
                const payload = {
                    products: newProducts || products,
                    orders: newOrders || orders,
                    messages: newMessages || messages
                };
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Access-Key': API_KEY },
                        body: JSON.stringify(payload)
                    });
                    if (newProducts) setProducts(newProducts);
                    if (newOrders) setOrders(newOrders);
                    if (newMessages) setMessages(newMessages);
                    showToast("Database Updated Successfully");
                } catch (e) { alert("Sync failed."); }
                setIsSyncing(false);
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const newProduct = {
                    ...formData,
                    id: editingProduct ? editingProduct.id : Date.now(),
                    price: parseFloat(formData.price),
                    stock: parseInt(formData.stock || 10),
                    rating: parseInt(formData.rating || 5),
                    sizes: formData.sizes.split(',').map(s => s.trim())
                };
                const updatedList = editingProduct ? products.map(p => p.id === editingProduct.id ? newProduct : p) : [...products, newProduct];
                syncWithDB(updatedList, null, null);
                setFormData({ title: '', category: 'flyer', price: '', sizes: '', image: '', description: '', stock: '', rating: '5' });
                setEditingProduct(null);
            };

            const startEdit = (p) => {
                setEditingProduct(p);
                setFormData({ ...p, price: p.price.toString(), stock: (p.stock || 10).toString(), rating: (p.rating || 5).toString(), sizes: p.sizes.join(', ') });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
                showToast(`Added ${product.title} to cart!`);
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const toggleWishlist = (product) => {
                const exists = wishlist.find(item => item.id === product.id);
                if (exists) {
                    setWishlist(prev => prev.filter(item => item.id !== product.id));
                    showToast("Removed from wishlist");
                } else {
                    setWishlist(prev => [...prev, product]);
                    showToast("Added to wishlist");
                }
            };

            const toggleCompare = (product) => {
                const exists = compareList.find(item => item.id === product.id);
                if (exists) {
                    setCompareList(prev => prev.filter(item => item.id !== product.id));
                    showToast("Removed from comparison");
                } else {
                    if (compareList.length >= 4) {
                        showToast("You can compare up to 4 products");
                        return;
                    }
                    setCompareList(prev => [...prev, product]);
                    showToast("Added to comparison");
                }
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const filteredProducts = useMemo(() => {
                let result = products.filter(p => {
                    const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCat = category === 'all' || p.category === category;
                    return matchesSearch && matchesCat;
                });

                if (sortBy === 'price-low') result.sort((a, b) => a.price - b.price);
                else if (sortBy === 'price-high') result.sort((a, b) => b.price - a.price);
                else if (sortBy === 'name-az') result.sort((a, b) => a.title.localeCompare(b.title));
                else if (sortBy === 'newest') result.sort((a, b) => b.id - a.id);

                return result;
            }, [products, searchQuery, category, sortBy]);

            const handleCheckout = () => {
                const newOrder = {
                    id: Math.random().toString(36).substr(2, 9).toUpperCase(),
                    userName: user.displayName,
                    userEmail: user.email,
                    items: [...cart],
                    total: cartTotal,
                    timestamp: new Date().toISOString()
                };
                const updatedOrders = [...orders, newOrder];
                syncWithDB(null, updatedOrders, null);
                setCart([]);

                const message = `*NEW ORDER - CreativeHub*\n\n` +
                    cart.map((item, i) => `${i+1}. ${item.title} (x${item.qty}) - GH₵${(item.price * item.qty).toFixed(2)}`).join('\n') +
                    `\n\n*Total Amount: GH₵${cartTotal.toFixed(2)}*\n\nPlease confirm my order!`;
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
            };

            const handleContactSubmit = (e) => {
                e.preventDefault();
                const newMessage = {
                    id: Date.now(),
                    ...contactForm,
                    timestamp: new Date().toISOString()
                };
                const updatedMessages = [...messages, newMessage];
                syncWithDB(null, null, updatedMessages);

                // Functional mailto as requested
                const mailtoLink = `mailto:andybright484@gmail.com?subject=New Message from ${contactForm.name}&body=${encodeURIComponent(contactForm.message)} (From: ${contactForm.email})`;
                window.location.href = mailtoLink;

                setContactForm({ name: '', email: '', message: '' });
                showToast("Message Sent to Andy Bright!");
            };

            if (authLoading || loading) return <div className="h-screen flex items-center justify-center bg-[#0f172a] text-white">Loading CreativeHub...</div>;

            // --- STEP 1: LOGIN/SIGNUP VIEW ---
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center login-gradient p-6">
                        <div className="w-full max-w-md p-10 rounded-[2.5rem] admin-glass text-white text-center shadow-2xl border-t border-white/20">
                            <h1 className="text-4xl font-black mb-2 tracking-tighter">CreativeHub.</h1>
                            <p className="text-gray-400 mb-10 text-sm">Sign in to start shopping</p>
                            <div className="space-y-4">
                                <button onClick={() => handleLogin('google')} className="w-full bg-white text-gray-900 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-100 transition">
                                    <Icon name="google" size={24} /> Continue with Google
                                </button>
                                <button onClick={() => handleLogin('apple')} className="w-full bg-black text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-gray-900 transition">
                                    <Icon name="apple" size={24} /> Continue with iCloud
                                </button>
                            </div>
                            <p className="mt-8 text-[10px] text-gray-500 uppercase tracking-widest">Secure 256-bit Encryption</p>
                        </div>
                    </div>
                );
            }

            // --- STEP 2: ADMIN VIEW ---
            if (view === 'admin') {
                if (!isAdminLoggedIn) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-[#0f172a] p-6 text-white">
                            <div className="w-full max-w-md p-8 rounded-3xl admin-glass">
                                <h1 className="text-2xl font-black mb-2 text-center">System Admin</h1>
                                <p className="text-gray-400 text-sm text-center mb-8">Secure portal for CreativeHub</p>
                                <input
                                    type="password" placeholder="Access Key"
                                    className="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-4 outline-none focus:border-purple-500 transition"
                                    value={adminPassInput} onChange={e => setAdminPassInput(e.target.value)}
                                    onKeyPress={e => e.key === 'Enter' && (adminPassInput === 'admin123' ? setIsAdminLoggedIn(true) : alert('Invalid'))}
                                />
                                <button
                                    onClick={() => adminPassInput === 'admin123' ? setIsAdminLoggedIn(true) : alert('Invalid Access Key')}
                                    className="w-full bg-purple-600 p-4 rounded-xl font-bold hover:bg-purple-700 transition"
                                >
                                    Authenticate
                                </button>
                                <button onClick={() => window.location.hash = ''} className="w-full mt-4 text-xs text-gray-500">Back to Store</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-[#0f172a] text-white p-4 md:p-10">
                        <div className="max-w-7xl mx-auto">
                            <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-12">
                                <div>
                                    <div className="flex items-center gap-2 text-purple-500 font-bold text-sm uppercase tracking-widest mb-1">
                                        <Icon name="layout" size={14} /> Admin Dashboard
                                    </div>
                                    <h1 className="text-4xl font-black">Inventory Manager</h1>
                                </div>
                                <div className="flex gap-4">
                                    {isSyncing && <span className="mt-2 text-blue-400 text-sm animate-pulse font-bold">Saving Changes...</span>}
                                    <button onClick={() => window.location.hash = ''} className="px-6 py-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 font-bold transition">View Store</button>
                                    <button onClick={() => setIsAdminLoggedIn(false)} className="px-6 py-3 bg-red-500/10 border border-red-500/20 text-red-500 rounded-xl font-bold">Admin Logout</button>
                                </div>
                            </header>

                             <div className="flex gap-6 border-b border-white/10 mb-8">
                                <button onClick={() => setAdminTab('inventory')} className={`pb-4 px-2 font-bold transition-all ${adminTab === 'inventory' ? 'text-purple-500 border-b-2 border-purple-500' : 'text-gray-500'}`}>Inventory</button>
                                <button onClick={() => setAdminTab('orders')} className={`pb-4 px-2 font-bold transition-all ${adminTab === 'orders' ? 'text-purple-500 border-b-2 border-purple-500' : 'text-gray-500'}`}>Orders ({orders.length})</button>

                                                        <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center text-yellow-500">{'⭐'.repeat(p.rating)}</div>
                                                        <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center uppercase text-xs font-bold tracking-widest text-gray-900 dark:text-white">{p.category}</div>
                                                        <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center text-sm text-gray-900 dark:text-white">{p.stock > 0 ? 'In Stock' : 'Out of Stock'}</div>
                                                        <div className="h-10 flex items-center justify-center pt-2">
                                                            <button onClick={() => { addToCart(p); setShowCompare(false); }} className="bg-black text-white px-6 py-2 rounded-full text-xs font-bold hover:scale-105 transition">Add to Cart</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {selectedProduct && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                                <motion.div
                                    initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                    className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedProduct(null)}
                                />
                                <motion.div
                                    initial={{ scale: 0.9, opacity: 0, y: 20 }}
                                    animate={{ scale: 1, opacity: 1, y: 0 }}
                                    exit={{ scale: 0.9, opacity: 0, y: 20 }}
                                    className={`relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl ${darkMode ? 'bg-gray-900 border border-gray-800' : 'bg-white'} shadow-2xl p-6 md:p-8 custom-scrollbar`}
                                >
                                    <button onClick={() => setSelectedProduct(null)} className="absolute top-6 right-6 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800"><Icon name="x" /></button>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <img src={selectedProduct.image} className="w-full aspect-[4/5] object-cover rounded-2xl shadow-lg" />
                                        <div className="flex flex-col">
                                            <span className="text-purple-600 font-bold uppercase tracking-widest text-xs mb-2">{selectedProduct.category}</span>
                                            <h2 className="text-3xl font-black mb-4">{selectedProduct.title}</h2>
                                            <p className="text-gray-500 mb-6 leading-relaxed">{selectedProduct.description}</p>
                                            <div className="mb-6">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h4 className="font-bold text-sm uppercase text-gray-400">Available Options</h4>
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${selectedProduct.stock < 5 ? 'bg-red-500 text-white' : 'bg-green-500/10 text-green-500'}`}>
                                                        {selectedProduct.stock} in stock
                                                    </span>
                                                </div>
                                                <div className="flex flex-wrap gap-2">
                                                    {selectedProduct.sizes && selectedProduct.sizes.map(s => (
                                                        <span key={s} className={`px-3 py-1 rounded-lg text-xs font-bold ${darkMode ? 'bg-gray-800' : 'bg-gray-100'}`}>{s}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="mt-auto pt-6 flex items-center justify-between border-t border-gray-100 dark:border-gray-800">
                                                <span className="text-3xl font-black text-purple-600">GH₵{selectedProduct.price}</span>
                                                <button onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }} className="bg-purple-600 text-white px-8 py-3 rounded-2xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-500/30">Add to Cart</button>
                                            </div>
                                        </div>
                                    </div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div className="flex gap-2 overflow-x-auto pb-2 md:pb-0 custom-scrollbar scroll-smooth">
                                {['all', 'flyer', 'poster', 'tshirt', 'frame', 'photoshop', 'handbags'].map(cat => (
                                    <button key={cat} onClick={() => setCategory(cat)} className={`px-6 py-2 rounded-full capitalize whitespace-nowrap transition-all ${category === cat ? 'bg-purple-600 text-white shadow-lg' : (darkMode ? 'bg-gray-800 text-gray-400' : 'bg-white text-gray-600 border')}`}>
                                        {cat}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <span className="text-xs font-bold text-gray-500 uppercase">Sort By:</span>
                                <select
                                    value={sortBy}
                                    onChange={(e) => setSortBy(e.target.value)}
                                    className={`text-sm font-bold py-2 px-4 rounded-xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-900'}`}
                                >
                                    <option value="newest">Newest First</option>
                                    <option value="price-low">Price: Low to High</option>
                                    <option value="price-high">Price: High to Low</option>
                                    <option value="name-az">Name: A-Z</option>
                                </select>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredProducts.map((product, idx) => (
                                <motion.div
                                    key={product.id}
                                    layout
                                    initial={{ opacity: 0, y: 20 }}
                                    whileInView={{ opacity: 1, y: 0 }}
                                    transition={{ delay: idx * 0.05 }}
                                    whileHover={{ y: -8 }}
                                    className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all border group`}
                                >
                                    <div className="relative overflow-hidden aspect-[4/5]">
                                        <img src={product.image} alt={product.title} onClick={() => setSelectedProduct(product)} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 cursor-pointer" />
                                        <div className="absolute top-3 right-3 flex flex-col gap-2">
                                            <button onClick={() => toggleWishlist(product)} className="p-2 bg-white/90 backdrop-blur rounded-full text-red-500 shadow-sm hover:scale-110 transition">
                                                <Icon name={wishlist.find(item => item.id === product.id) ? 'heartFilled' : 'heart'} size={18} />
                                            </button>
                                            <button onClick={() => toggleCompare(product)} className={`p-2 bg-white/90 backdrop-blur rounded-full shadow-sm hover:scale-110 transition ${compareList.find(item => item.id === product.id) ? 'text-blue-500' : 'text-gray-400'}`}>
                                                <Icon name="layout" size={18} />
                                            </button>
                                        </div>
                                        <div className="absolute top-3 left-3">
                                            <span className="bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold uppercase text-gray-800">{product.category}</span>
                                        </div>
                                        {product.stock < 5 && (
                                            <div className="absolute bottom-3 left-3">
                                                <span className="bg-red-500 text-white px-2 py-1 rounded text-[10px] font-bold animate-pulse">Low Stock</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="p-5">
                                        <h3 className="font-bold text-lg mb-1 truncate">{product.title}</h3>
                                        <p className="text-sm text-gray-500 mb-4 line-clamp-2 h-10">{product.description}</p>
                                        <div className="flex items-center justify-between">
                                            <span className="text-xl font-black text-purple-600">GH₵{product.price}</span>
                                            <button onClick={() => addToCart(product)} className="bg-gray-900 dark:bg-purple-600 text-white p-2.5 rounded-xl hover:scale-110 transition">
                                                <Icon name="plus" size={20} />
                                            </button>
                                        </div>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </main>

                    <section className="max-w-7xl mx-auto px-4 py-20 border-t border-gray-100 dark:border-gray-800">
                        <div className="text-center mb-16">
                            <h2 className="text-3xl font-black mb-4">What Our Clients Say</h2>
                            <p className="text-gray-500">Trusted by hundreds of businesses across Ghana.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {[
                                { name: "Ama Serwaa", role: "Event Planner", text: "CreativeHub delivered the most stunning flyers for my gala night. Highly recommended!" },
                                { name: "Kofi Mensah", role: "Start-up Founder", text: "The branding package was exactly what we needed. Fast and professional service." },
                                { name: "Abena Appiah", role: "Photographer", text: "Best place for high-quality picture frames. My clients love them!" }
                            ].map((t, i) => (
                                <div key={i} className={`p-8 rounded-3xl ${darkMode ? 'bg-gray-800' : 'bg-white shadow-sm border border-gray-100'}`}>
                                    <div className="flex gap-1 mb-4 text-yellow-500">
                                        {[...Array(5)].map((_, j) => <Icon key={j} name="sun" size={16} className="fill-current" />)}
                                    </div>
                                    <p className="italic mb-6 text-sm">"{t.text}"</p>
                                    <div className="font-bold">{t.name}</div>
                                    <div className="text-xs text-purple-500">{t.role}</div>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section className={`py-20 ${darkMode ? 'bg-purple-900/10' : 'bg-purple-50'}`}>
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-4xl font-black mb-6">Let's Create Something Amazing</h2>
                                <p className="text-gray-500 mb-8">Have a custom request or need a professional photoshoot? Get in touch with our team today.</p>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-4">
                                        <div className="p-3 bg-purple-600 text-white rounded-2xl"><Icon name="edit" /></div>
                                        <div>
                                            <div className="font-bold text-sm">Our Office</div>
                                            <div className="text-xs text-gray-500">Accra, Ghana</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="p-3 bg-purple-600 text-white rounded-2xl"><Icon name="cart" /></div>
                                        <div>
                                            <div className="font-bold text-sm">WhatsApp</div>
                                            <div className="text-xs text-gray-500">+233 53 465 7415</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className={`p-8 rounded-[2.5rem] ${darkMode ? 'bg-gray-800' : 'bg-white shadow-xl'}`}>
                                <form className="space-y-4" onSubmit={handleContactSubmit}>
                                    <input type="text" required placeholder="Your Name" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.name} onChange={e => setContactForm({...contactForm, name: e.target.value})} />
                                    <input type="email" required placeholder="Your Email" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.email} onChange={e => setContactForm({...contactForm, email: e.target.value})} />
                                    <textarea required placeholder="Tell us about your project..." rows="4" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.message} onChange={e => setContactForm({...contactForm, message: e.target.value})} />
                                    <button type="submit" className="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-500/30">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <footer className={`mt-20 py-10 border-t ${darkMode ? 'border-gray-800 bg-gray-950' : 'border-gray-200 bg-white'}`}>
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <h2 className="text-xl font-bold mb-4">CreativeHub.</h2>
                            <p className="text-gray-500 text-sm">Elevating your brand with premium designs.</p>
                            <div className="mt-4 flex justify-center gap-6 text-xs font-bold text-gray-400">
                                <a href="#" className="hover:text-purple-500">Home</a>
                                <a href="#" className="hover:text-purple-500">Privacy</a>
                            </div>
                            <p className="mt-8 text-[10px] text-gray-500 uppercase tracking-widest">&copy; 2026 CreativeHub All Rights Reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdvancedEcommerce />);
    </script>
</body>
</html>
