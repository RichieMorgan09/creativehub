            100% { transform: translateX(200%) skewX(-15deg); }

        .shimmer-effect { overflow: hidden; position: relative; }
        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const newProduct = {
                    ...formData,
                    id: editingProduct ? editingProduct.id : Date.now(),
                    price: parseFloat(formData.price),
                    stock: parseInt(formData.stock || 10),
                    rating: parseInt(formData.rating || 5),
                    sizes: formData.sizes.split(',').map(s => s.trim())
                };
                const updatedList = editingProduct ? products.map(p => p.id === editingProduct.id ? newProduct : p) : [...products, newProduct];
                syncWithDB(updatedList, null, null);
                setFormData({ title: '', category: 'flyer', price: '', sizes: '', image: '', description: '', stock: '', rating: '5' });
                setEditingProduct(null);
            };

            const startEdit = (p) => {
                setEditingProduct(p);
                setFormData({ ...p, price: p.price.toString(), stock: (p.stock || 10).toString(), rating: (p.rating || 5).toString(), sizes: p.sizes.join(', ') });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
                showToast(`Added ${product.title} to cart!`);
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => item.id === id ? { ...item, qty: Math.max(1, item.qty + delta) } : item));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const toggleWishlist = (product) => {
                const exists = wishlist.find(item => item.id === product.id);
                if (exists) {
                    setWishlist(prev => prev.filter(item => item.id !== product.id));
                    showToast("Removed from wishlist");
                } else {
                    setWishlist(prev => [...prev, product]);
                    showToast("Added to wishlist");
                }
            };

            const toggleCompare = (product) => {
                const exists = compareList.find(item => item.id === product.id);
                if (exists) {
                    setCompareList(prev => prev.filter(item => item.id !== product.id));
                    showToast("Removed from comparison");
                } else {
                    if (compareList.length >= 4) {
                        showToast("You can compare up to 4 products");
                        return;
                    }
                    setCompareList(prev => [...prev, product]);
                    showToast("Added to comparison");
                }
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const filteredProducts = useMemo(() => {
                let result = products.filter(p => {
                    const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCat = category === 'all' || p.category === category;
                    return matchesSearch && matchesCat;
                });

                if (sortBy === 'price-low') result.sort((a, b) => a.price - b.price);
                else if (sortBy === 'price-high') result.sort((a, b) => b.price - a.price);
                else if (sortBy === 'name-az') result.sort((a, b) => a.title.localeCompare(b.title));
                else if (sortBy === 'newest') result.sort((a, b) => b.id - a.id);

                return result;
            }, [products, searchQuery, category, sortBy]);

            const handleCheckout = () => {
                const newOrder = {
                    id: Math.random().toString(36).substr(2, 9).toUpperCase(),
                    userName: user.displayName,
                    userEmail: user.email,
                    items: [...cart],
                    total: cartTotal,
                    timestamp: new Date().toISOString()
                };
                const updatedOrders = [...orders, newOrder];
                syncWithDB(null, updatedOrders, null);
                setCart([]);

                const message = `*NEW ORDER - CreativeHub*\n\n` +
                    cart.map((item, i) => `${i+1}. ${item.title} (x${item.qty}) - GH₵${(item.price * item.qty).toFixed(2)}`).join('\n') +
                    `\n\n*Total Amount: GH₵${cartTotal.toFixed(2)}*\n\nPlease confirm my order!`;
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
            };

            const handleChat = (e) => {
                e.preventDefault();
                const input = chatInput.trim().toLowerCase();
                if (!input) return;

                const userMsg = { sender: 'user', text: chatInput };
                setChatMessages(prev => [...prev, userMsg]);
                setChatInput('');

                setTimeout(() => {
                    let botResponse = "I'm not sure about that. Would you like to see our top products?";

                    if (input.includes('hello') || input.includes('hi')) {
                        botResponse = "Hello! How can I help you find the perfect design today?";
                    } else if (input.includes('price') || input.includes('how much')) {
                        botResponse = "Our prices vary by category. Flyers start at GH₵ 50, and custom frames start at GH₵ 120. Anything specific you're looking for?";
                    } else if (input.includes('poster') || input.includes('frame') || input.includes('tshirt') || input.includes('flyer') || input.includes('handbags') || input.includes('photoshop')) {
                        const keyword = ['poster', 'frame', 'tshirt', 'flyer', 'handbags', 'photoshop'].find(word => input.includes(word));
                        const found = products.filter(p => p.category.toLowerCase().includes(keyword));
                        if (found.length > 0) {
                            botResponse = `I found something you might like! I've filtered the store for ${keyword} products for you. We have ${found.length} items available.`;
                            setCategory(keyword);

                            botResponse = `We usually have ${keyword} items, but they might be out of stock right now.`;
                        }
                    } else if (input.includes('contact') || input.includes('call')) {
                        botResponse = `You can reach us at ${WHATSAPP_NUMBER} or use the contact form below.`;
                    }

                    setChatMessages(prev => [...prev, { sender: 'bot', text: botResponse }]);

                                                        <Icon name="trash" size={18} />

                            <div className={`p-8 rounded-[2.5rem] ${darkMode ? 'bg-gray-800' : 'bg-white shadow-xl'}`}>
                                <form className="space-y-4" onSubmit={handleContactSubmit}>
                                    <input type="text" required placeholder="Your Name" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.name} onChange={e => setContactForm({...contactForm, name: e.target.value})} />
                                    <input type="email" required placeholder="Your Email" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.email} onChange={e => setContactForm({...contactForm, email: e.target.value})} />
                                    <textarea required placeholder="Tell us about your project..." rows="4" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.message} onChange={e => setContactForm({...contactForm, message: e.target.value})} />
                                    <button type="submit" className="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-500/30">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </section>

                    <footer className={`mt-20 py-10 border-t ${darkMode ? 'border-gray-800 bg-gray-950' : 'border-gray-200 bg-white'}`}>
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <h2 className="text-xl font-bold mb-4">CreativeHub.</h2>
                            <p className="text-gray-500 text-sm">Elevating your brand with premium designs.</p>
                            <div className="mt-4 flex justify-center gap-6 text-xs font-bold text-gray-400">
                                <a href="#" className="hover:text-purple-500">Home</a>
                                <button onClick={() => alert('CreativeHub Privacy Policy: We value your data. All information is kept secure and used only for order processing.')} className="hover:text-purple-500">Privacy</button>
                                <button onClick={() => alert('About CreativeHub: Established in Accra, we provide high-end design, branding, and photography services to help your business shine.')} className="hover:text-purple-500">About Us</button>
                            </div>
                            <p className="mt-8 text-[10px] text-gray-500 uppercase tracking-widest">&copy; 2026 CreativeHub All Rights Reserved.</p>
                        </div>
                    </footer>

                    {/* --- ORDER HISTORY MODAL --- */}
                    <AnimatePresence>
                        {isOrderHistoryOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsOrderHistoryOpen(false)} />
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className={`relative w-full max-w-2xl rounded-3xl ${darkMode ? 'bg-gray-900 border border-gray-800' : 'bg-white'} shadow-2xl p-8 max-h-[80vh] overflow-y-auto`}>
                                    <div className="flex justify-between items-center mb-8">
                                        <h2 className="text-3xl font-black">My Orders</h2>
                                        <button onClick={() => setIsOrderHistoryOpen(false)} className="p-2 hover:bg-gray-100 rounded-full dark:text-white"><Icon name="x" /></button>
                                    </div>
                                    <div className="space-y-6">
                                        {userOrders.length === 0 ? <p className="text-center py-10 opacity-50 italic">You haven't placed any orders yet.</p> :
                                            userOrders.map(o => (
                                                <div key={o.id} className="p-6 border dark:border-gray-800 rounded-2xl">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <span className="font-bold text-xs uppercase tracking-widest text-purple-600">Order #{o.id.toString().slice(-6)}</span>
                                                        <span className="text-xs text-gray-500">{new Date(o.timestamp).toLocaleDateString()}</span>
                                                    </div>
                                                    <div className="space-y-2 mb-4">
                                                        {o.items.map((item, i) => (
                                                            <div key={i} className="flex justify-between text-sm">
                                                                <span className="dark:text-gray-300">{item.title} x{item.qty}</span>
                                                                <span className="font-bold">GH₵{(item.price * item.qty).toFixed(2)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="border-t dark:border-gray-800 pt-4 flex justify-between items-center">
                                                        <span className="font-bold">Total Amount</span>
                                                        <span className="text-xl font-black text-purple-600">GH₵{o.total.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* --- AR PREVIEW OVERLAY --- */}
                    {arActive && arProduct && (
                        <div className="fixed inset-0 z-[120] bg-black flex flex-col">
                            <div className="relative flex-1 flex items-center justify-center p-12 overflow-hidden">
                                {isCameraActive ? (
                                    <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover opacity-60"></video>
                                ) : (
                                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2787')] bg-cover bg-center opacity-30"></div>
                                )}

                                {/* Techy Scanning Overlay */}
                                <div className="absolute inset-0 pointer-events-none">
                                    <div className="absolute top-10 left-10 w-20 h-20 border-t-2 border-l-2 border-purple-500/50"></div>
                                    <div className="absolute top-10 right-10 w-20 h-20 border-t-2 border-r-2 border-purple-500/50"></div>
                                    <div className="absolute bottom-10 left-10 w-20 h-20 border-b-2 border-l-2 border-purple-500/50"></div>
                                    <div className="absolute bottom-10 right-10 w-20 h-20 border-b-2 border-r-2 border-purple-500/50"></div>
                                    <div className="ar-scan-line absolute top-0 left-0 w-full opacity-30"></div>
                                </div>

                                <div className="absolute top-10 left-1/2 -translate-x-1/2 text-white/70 text-[10px] font-bold tracking-[0.3em] uppercase backdrop-blur-sm px-4 py-1 rounded-full border border-white/10">
                                    Augmented Reality System v2.0
                                </div>

                                <motion.div
                                    drag
                                    dragConstraints={{ left: -300, right: 300, top: -300, bottom: 300 }}
                                    className="relative z-10 w-full max-w-sm aspect-square bg-white/5 backdrop-blur-sm p-4 rounded-3xl border border-white/20 shadow-[0_0_50px_rgba(0,0,0,0.5)] shimmer-effect"
                                    style={{ scale: arScale }}
                                >
                                    <div className="absolute -top-2 -left-2 w-6 h-6 border-t-2 border-l-2 border-purple-400"></div>
                                    <div className="absolute -bottom-2 -right-2 w-6 h-6 border-b-2 border-r-2 border-purple-400"></div>

                                    <img
                                        src={arProduct.image}
                                        className="w-full h-full object-contain relative z-10"
                                        style={{
                                            filter: 'drop-shadow(0 10px 20px rgba(0,0,0,0.3)) contrast(1.1) brightness(1.05)',
                                            transform: 'perspective(1000px) rotateX(5deg)'
                                        }}
                                    />
                                    {/* Grounded Shadow */}
                                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 w-4/5 h-12 bg-black/60 blur-3xl rounded-[100%] z-0"></div>
                                </motion.div>

                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 w-full px-10 text-center z-50">
                                    {/* Scale Controls */}
                                    <div className="flex items-center gap-4 bg-black/40 backdrop-blur-md p-2 rounded-2xl border border-white/10 mb-2">
                                        <button
                                            onClick={() => setArScale(Math.max(0.2, arScale - 0.1))}
                                            className="w-10 h-10 flex items-center justify-center bg-white/10 rounded-xl hover:bg-white/20 text-white font-bold"
                                        >-</button>
                                        <span className="text-white text-xs font-black min-w-[3rem]">{Math.round(arScale * 100)}%</span>
                                        <button
                                            onClick={() => setArScale(Math.min(3, arScale + 0.1))}
                                            className="w-10 h-10 flex items-center justify-center bg-white/10 rounded-xl hover:bg-white/20 text-white font-bold"
                                        >+</button>
                                    </div>

                                    <div className="bg-black/60 text-white px-6 py-2 rounded-full text-xs font-bold backdrop-blur-md border border-white/20">
                                        {isCameraActive ? 'Point camera at a flat surface and drag the item' : 'Environment simulation active - Test positioning'}
                                    </div>
                                    <p className="text-[10px] text-white/50 uppercase tracking-widest animate-pulse">
                                        Touch and drag to position • Use +/- to scale
                                    </p>
                                </div>
                            </div>
                            <div className="p-8 bg-gray-900 border-t border-white/10 flex flex-col gap-4">
                                <div className="flex justify-between items-center text-white">
                                    <div>
                                        <h3 className="font-bold">{arProduct.title}</h3>
                                        <p className="text-xs text-gray-400">GH₵{arProduct.price}</p>
                                    </div>
                                    <button onClick={() => setIsCameraActive(!isCameraActive)} className="bg-white/10 p-3 rounded-xl hover:bg-white/20 transition">
                                        <Icon name="camera" size={20} />
                                    </button>
                                </div>
                                <button
                                    onClick={() => {
                                        setArActive(false);
                                        setArProduct(null);
                                        setIsCameraActive(false);
                                    }}
                                    className="w-full py-4 bg-red-600 text-white rounded-2xl font-bold"
                                >
                                    Close AR Preview
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- SMART AI ASSISTANT --- */}
                    <div className="fixed bottom-6 right-6 z-[90]">
                        <AnimatePresence>
                            {chatInput !== null && ( // Just to have a way to toggle it if I added a state, but for now it's always "visible" or collapsed
                                <div className="relative">
                                    {/* Chat window could be toggled by a button, but let's make it a nice floating assistant */}
                                </div>
                            )}
                        </AnimatePresence>
                        <button
                            onClick={() => {
                                const win = document.getElementById('ai-chat-win');
                                win.classList.toggle('hidden');
                            }}
                            className="bg-purple-600 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition group relative"
                            title="AI Assistant"
                        >
                            <Icon name="message" />
                            <span className="absolute right-full mr-4 bg-black text-white px-3 py-1 rounded-lg text-xs font-bold opacity-0 group-hover:opacity-100 transition whitespace-nowrap">Need Help?</span>
                        </button>

                        <div id="ai-chat-win" className="hidden absolute bottom-20 right-0 w-80 md:w-96 bg-white dark:bg-gray-900 rounded-3xl shadow-2xl border dark:border-gray-800 overflow-hidden flex flex-col animate-fade-in-up">
                            <div className="bg-purple-600 p-4 text-white font-bold flex justify-between items-center">
                                <span>AI Assistant</span>
                                <button onClick={() => document.getElementById('ai-chat-win').classList.add('hidden')}><Icon name="x" size={16}/></button>
                            </div>
                            <div className="h-80 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-gray-800 custom-scrollbar">
                                {chatMessages.map((m, i) => (
                                    <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-3 rounded-2xl text-sm ${m.sender === 'user' ? 'bg-purple-600 text-white' : 'bg-white dark:bg-gray-700 shadow-sm dark:text-white'}`}>
                                            {m.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={handleChat} className="p-4 bg-white dark:bg-gray-900 border-t dark:border-gray-800 flex gap-2">
                                <input
                                    type="text"
                                    placeholder="Type a message..."
                                    className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-500 dark:text-white"
                                    value={chatInput}
                                    onChange={e => setChatInput(e.target.value)}
                                />
                                <button type="submit" className="bg-purple-600 text-white p-2 rounded-xl"><Icon name="plus" size={16}/></button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DesignPortfolio />);
    </script>
</body>
</html>
