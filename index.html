<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CreativeHub - Professional E-commerce Platform with Advanced Features">
    <title>CreativeHub | Advanced Store</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .cart-slide {
            transition: transform 0.3s ease-in-out;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        .admin-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-gradient {
            background: radial-gradient(circle at top right, #4f46e5, transparent), radial-gradient(circle at bottom left, #7c3aed, transparent), #0f172a;
        }

        select option {
            background-color: #1e293b;
            color: white;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        /* Advanced Features Styles */
        .price-range-slider {
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #8b5cf6;
            outline: none;
        }

        .price-range-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.5);
        }

        .price-range-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.5);
        }

        .rating-stars {
            display: flex;
            gap: 2px;
        }

        .star {
            color: #fbbf24;
            font-size: 14px;
        }

        .product-badge {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>

                share: <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>

            return <div style={{ width: size, height: size }} className={className}>{icons[name]}</div>;
        };

        const AdvancedEcommerce = () => {
            // AUTH STATE
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // STORE STATE
            const [view, setView] = useState('store');
            const [products, setProducts] = useState([]);
            const [sortBy, setSortBy] = useState('newest');
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('ch_cart') || '[]'));
            const [wishlist, setWishlist] = useState(() => JSON.parse(localStorage.getItem('ch_wishlist') || '[]'));
            const [recentlyViewed, setRecentlyViewed] = useState(() => JSON.parse(localStorage.getItem('ch_recent') || '[]'));
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isWishlistOpen, setIsWishlistOpen] = useState(false);
            const [isOrderHistoryOpen, setIsOrderHistoryOpen] = useState(false);
            const [reviewForm, setReviewForm] = useState({ rating: 5, comment: '' });
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [category, setCategory] = useState('all');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ch_theme') === 'dark');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);

            // ADVANCED FILTER STATE
            const [priceRange, setPriceRange] = useState([0, 10000]);
            const [selectedRating, setSelectedRating] = useState(0);
            const [inStockOnly, setInStockOnly] = useState(false);
            const [showFilters, setShowFilters] = useState(false);

            // ADMIN STATE
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPassInput, setAdminPassInput] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [formData, setFormData] = useState({ title: '', category: 'flyer', price: '', sizes: '', image: '', description: '', stock: '', rating: 5 });
            const [adminTab, setAdminTab] = useState('inventory');
            const [orders, setOrders] = useState([]);
            const [messages, setMessages] = useState([]);
            const [orderSearch, setOrderSearch] = useState('');
            const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });
            const [showScroll, setShowScroll] = useState(false);

            // ANALYTICS STATE
            const [analytics, setAnalytics] = useState({
                totalViews: 0,
                totalSales: 0,
                avgOrderValue: 0,
                topProduct: null
            });

            // --- REDEFINED FEATURES STATE ---
            // AI Assistant
            const [showChat, setShowChat] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                { sender: 'bot', text: 'Hi! I am your AI Assistant. How can I help you today?' }
            ]);
            const [chatInput, setChatInput] = useState('');

            // AR Preview
            const [arActive, setArActive] = useState(false);
            const [arProduct, setArProduct] = useState(null);
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [facingMode, setFacingMode] = useState('environment'); // Default to back camera
            const videoRef = useRef(null);

            useEffect(() => {
                let stream = null;
                if (isCameraActive) {
                    if (videoRef.current && videoRef.current.srcObject) {
                        videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                    }

                    navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
                        .then(s => {
                            stream = s;
                            if (videoRef.current) videoRef.current.srcObject = stream;
                        })
                        .catch(err => {
                            console.error("Camera error:", err);
                            // Fallback to any camera if specific facing mode fails
                            navigator.mediaDevices.getUserMedia({ video: true })
                                .then(s => {
                                    stream = s;
                                    if (videoRef.current) videoRef.current.srcObject = s;
                                })
                                .catch(e => {
                                    showToast("Unable to access camera. Please allow permissions.");
                                    setIsCameraActive(false);
                                });
                        });
                }
                return () => {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                };
            }, [isCameraActive, facingMode]);

            useEffect(() => {
                if (!arActive) setIsCameraActive(false);
            }, [arActive]);

            useEffect(() => {
                if (selectedProduct) {
                    setRecentlyViewed(prev => {
                        const filtered = prev.filter(p => p.id !== selectedProduct.id);
                        const updated = [selectedProduct, ...filtered].slice(0, 4);
                        localStorage.setItem('ch_recent', JSON.stringify(updated));
                        return updated;
                    });
                }
            }, [selectedProduct]);

            // Product Comparison
            const [compareList, setCompareList] = useState([]);
            const [showCompare, setShowCompare] = useState(false);

            // SCROLL EFFECT
            useEffect(() => {
                const checkScroll = () => setShowScroll(window.scrollY > 300);
                window.addEventListener('scroll', checkScroll);
                return () => window.removeEventListener('scroll', checkScroll);
            }, []);

            const WHATSAPP_NUMBER = "233534657415";
            const BIN_ID = '6944b3a5d0ea881f403340b4';
            const API_KEY = '$2a$10$oBQ621K6dKBjJwYC6s2km.xGmBO3YVQ3pLjq0IfkMMvE8/Psf7Aam';

            // AUTH EFFECTS
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user && !authLoading && new URLSearchParams(window.location.search).get('demo') === 'true') {
                    handleLogin('demo');
                }
            }, [user, authLoading]);

            // DATA EFFECTS
            useEffect(() => {
                const handleHash = () => setView(window.location.hash === '#/admin' ? 'admin' : 'store');
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            useEffect(() => {
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Access-Key': API_KEY } })
                    .then(res => res.json())
                    .then(data => {
                        let enriched = (data.record.products || []).map(p => ({
                            ...p,
                            category: p.category === 'handbags' ? 'handbag' : p.category, // Normalize plural to singular
                            rating: p.rating || Math.floor(Math.random() * 2) + 4,
                            views: p.views || Math.floor(Math.random() * 1000)
                        }));

                        // Fallback for Handbags if missing (Fix for empty category)
                        if (!enriched.some(p => p.category === 'handbag')) {
                            const mockHandbags = [
                                { id: 'hb-1', title: 'Luxury Leather Tote', category: 'handbag', price: 450, image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=800&auto=format&fit=crop', description: 'Premium leather tote bag perfect for daily use.', stock: 15, rating: 5, views: 120 },
                                { id: 'hb-2', title: 'Chic Crossbody Bag', category: 'handbag', price: 280, image: 'https://images.unsplash.com/photo-1591561954557-26941169b49e?q=80&w=800&auto=format&fit=crop', description: 'Stylish crossbody bag for evening outings.', stock: 8, rating: 4, views: 95 },
                                { id: 'hb-3', title: 'Classic Clutch', category: 'handbag', price: 150, image: 'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?q=80&w=800&auto=format&fit=crop', description: 'Elegant clutch for formal events.', stock: 20, rating: 5, views: 210 }
                            ];
                            enriched = [...enriched, ...mockHandbags];
                        }

                        setProducts(enriched);
                        setOrders(data.record.orders || []);
                        setMessages(data.record.messages || []);
                        setLoading(false);
                    })
                    .catch(err => { console.error(err); setLoading(false); });
            }, []);

            // ADVANCED ANALYTICS
            useEffect(() => {
                if (orders.length > 0) {
                    const totalSales = orders.reduce((sum, o) => sum + o.total, 0);
                    const avgOrderValue = totalSales / orders.length;
                    const topProduct = products.reduce((max, p) => (p.views > (max.views || 0) ? p : max), {});
                    setAnalytics({
                        totalViews: products.reduce((sum, p) => sum + (p.views || 0), 0),
                        totalSales: totalSales,
                        avgOrderValue: avgOrderValue,
                        topProduct: topProduct
                    });
                }
            }, [orders, products]);

            // UTILITY FUNCTIONS
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = (provider) => {
                if (provider === 'google') {
                    const googleProvider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(googleProvider).catch(err => {
                        console.warn('Google auth failed, using demo mode:', err);
                        auth.signInAnonymously().catch(e => console.error(e));
                    });
                } else if (provider === 'apple') {
                    const appleProvider = new firebase.auth.OAuthProvider('apple.com');
                    auth.signInWithPopup(appleProvider).catch(err => {
                        console.warn('Apple auth failed, using demo mode:', err);
                        auth.signInAnonymously().catch(e => console.error(e));
                    });
                } else if (provider === 'demo') {
                    // auth.signInAnonymously().catch(err => console.error(err));
                    // Bypass Firebase Auth for Guest/Demo mode
                    setUser({
                        displayName: 'Guest',
                        email: 'guest@example.com',
                        uid: 'guest-' + Date.now()
                    });
                }
            };

            const logout = () => {
                auth.signOut();
                setUser(null); // Explicitly clear local user state for Guest mode
                setCart([]);
                setWishlist([]);
                localStorage.removeItem('ch_cart');
                localStorage.removeItem('ch_wishlist');
            };

            const syncWithDB = (newProducts = null, newOrders = null, newMessages = null) => {
                setIsSyncing(true);
                const payload = {
                    products: newProducts !== null ? newProducts : products,
                    orders: newOrders !== null ? newOrders : orders,
                    messages: newMessages !== null ? newMessages : messages
                };
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Access-Key': API_KEY },
                    body: JSON.stringify(payload)
                })
                    .then(() => {
                        if (newProducts !== null) setProducts(newProducts);
                        if (newOrders !== null) setOrders(newOrders);
                        if (newMessages !== null) setMessages(newMessages);
                        showToast('Database updated successfully!');
                        setIsSyncing(false);
                    })
                    .catch(err => { console.error(err); setIsSyncing(false); });
            };

            // ADVANCED FILTERING
            const filteredProducts = useMemo(() => {
                return products
                    .filter(p => {
                        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.description.toLowerCase().includes(searchQuery.toLowerCase());
                        const matchesCategory = category === 'all' || p.category === category;
                        const matchesPrice = p.price >= priceRange[0] && p.price <= priceRange[1];
                        const matchesRating = selectedRating === 0 || p.rating >= selectedRating;
                        const matchesStock = !inStockOnly || p.stock > 0;
                        return matchesSearch && matchesCategory && matchesPrice && matchesRating && matchesStock;
                    })
                    .sort((a, b) => {
                        if (sortBy === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
                        if (sortBy === 'price-low') return a.price - b.price;
                        if (sortBy === 'price-high') return b.price - a.price;
                        if (sortBy === 'name-az') return a.title.localeCompare(b.title);
                        if (sortBy === 'rating') return b.rating - a.rating;
                        if (sortBy === 'trending') return b.views - a.views;
                        return 0;
                    });
            }, [products, searchQuery, category, priceRange, selectedRating, inStockOnly, sortBy]);

            const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.qty), 0), [cart]);

            const addToCart = (product) => {
                const existingItem = cart.find(item => item.id === product.id);
                let updatedCart;
                if (existingItem) {
                    updatedCart = cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                } else {
                    updatedCart = [...cart, { ...product, qty: 1 }];
                }
                setCart(updatedCart);
                localStorage.setItem('ch_cart', JSON.stringify(updatedCart));
                showToast('Added to cart!');
            };

            const removeFromCart = (id) => {
                const updatedCart = cart.filter(item => item.id !== id);
                setCart(updatedCart);
                localStorage.setItem('ch_cart', JSON.stringify(updatedCart));
            };

            const updateQty = (id, change) => {
                const updatedCart = cart.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + change;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean);
                setCart(updatedCart);
                localStorage.setItem('ch_cart', JSON.stringify(updatedCart));
            };

            const toggleWishlist = (product) => {
                const isInWishlist = wishlist.find(item => item.id === product.id);
                const updatedWishlist = isInWishlist ? wishlist.filter(item => item.id !== product.id) : [...wishlist, product];
                setWishlist(updatedWishlist);
                localStorage.setItem('ch_wishlist', JSON.stringify(updatedWishlist));
            };

            // CHECKOUT REDIRECT STATE
            const [isCheckoutRedirect, setIsCheckoutRedirect] = useState(false);

            const handleCheckout = () => {
                if (cart.length === 0) return;

                // FORCE LOGIN FOR GUEST USERS
                if (user.email === 'guest@example.com') {
                    setIsCheckoutRedirect(true);
                    logout();
                    showToast('Please sign in to complete your order.');

                                    </div>
                                </div>
                            </div>
                            <div className={`p-8 rounded-[2.5rem] ${darkMode ? 'bg-gray-800' : 'bg-white shadow-xl'}`}>

                                    <textarea required placeholder="Tell us about your project..." rows="4" className={`w-full p-4 rounded-2xl border outline-none focus:ring-2 focus:ring-purple-500 ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-transparent'}`}
                                        value={contactForm.message} onChange={e => setContactForm({ ...contactForm, message: e.target.value })} />
                                    <button type="submit" className="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-500/30">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </motion.section>

                    {/* Newsletter Section */}
                    <motion.section
                        initial={{ opacity: 0, y: 30 }}
                        whileInView={{ opacity: 1, y: 0 }}

                    >
                        <div className="max-w-4xl mx-auto relative rounded-[3rem] overflow-hidden p-10 md:p-16 text-center">

                                <span className="inline-block py-1 px-3 rounded-full bg-purple-500/20 text-purple-300 text-xs font-bold uppercase tracking-widest mb-4 border border-purple-500/30">
                                    Stay Updated

                                <h2 className="text-3xl md:text-5xl font-black text-white mb-6">Join Our Creative Community</h2>
                                <p className="text-purple-200 mb-8 max-w-2xl mx-auto">Get exclusive deals, design tips, and early access to new collections delivered to your inbox.</p>
                                <form onSubmit={(e) => { e.preventDefault(); showToast("Subscribed successfully!"); }} className="max-w-md mx-auto flex flex-col md:flex-row gap-4">
                                    <input

                                        className="flex-1 px-6 py-4 rounded-2xl bg-white/10 border border-white/10 text-white placeholder-purple-300/50 backdrop-blur-sm outline-none focus:ring-2 focus:ring-purple-500 transition"

                                        Subscribe

                                </form>
                            </div>
                        </div>
                    </motion.section>

                        {showScroll && (
                            <motion.button
                                initial={{ opacity: 0, scale: 0.5 }}

                                exit={{ opacity: 0, scale: 0.5 }}
                                whileHover={{ y: -5 }}
                                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                className="fixed bottom-8 left-8 z-40 bg-purple-600 text-white p-4 rounded-full shadow-2xl shadow-purple-600/40 hover:bg-purple-700 transition"
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            </motion.button>
                        )}
                    </AnimatePresence>

                    {recentlyViewed.length > 0 && (

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {recentlyViewed.map(product => (
                                    <motion.div
                                        key={product.id}
                                        whileHover={{ y: -5 }}
                                        onClick={() => setSelectedProduct(product)}
                                        className="cursor-pointer group"
                                    >
                                        <div className="aspect-[4/5] rounded-xl overflow-hidden mb-3">
                                            <img src={product.image} className="w-full h-full object-cover transition-transform group-hover:scale-110" />
                                        </div>
                                        <h3 className="font-bold text-sm truncate">{product.title}</h3>
                                        <p className="text-purple-600 font-bold text-xs">GH₵{product.price}</p>

                            <p className="mt-8 text-[10px] text-gray-500 uppercase tracking-widest">&copy; 2026 CreativeHub All Rights Reserved.</p>

                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={handleChatSubmit} className="p-3 border-t border-gray-100 dark:border-gray-700 flex gap-2">

                                    <button type="submit" className="p-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"><Icon name="trending" size={16} /></button>
                                </form>
                            </motion.div>
                        )

                    </AnimatePresence >

                                                <div className="absolute inset-0 bg-[linear-gradient(rgba(0,255,0,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(0,255,0,0.1)_1px,transparent_1px)] bg-[size:30px_30px] opacity-30 animate-pulse pointer-events-none"></div>

                                    <div className="p-6 text-center">
                                        <h3 className={`text-xl font-black mb-2 ${darkMode ? 'text-white' : 'text-gray-900'}`}>AR Preview: {arProduct.title}</h3>

                                                Activate Camera

                                        )}
                                    </div>
                                </div>
                            </div>

                    }

                    {/* --- COMPARISON BAR --- */}
                    {

                                    {compareList.map(p => <img key={p.id} src={p.image} className="w-10 h-10 rounded-full border-2 border-white dark:border-gray-800 object-cover" />)}

                                <div className="text-sm font-bold text-gray-900 dark:text-white">{compareList.length} items selected</div>

                            </div>
                        )
                    }

                    {/* --- COMPARISON MODAL --- */}
                    {
                        showCompare && (
                            <div className="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">

                                            <div className="font-bold text-gray-400 h-10 border-b dark:border-gray-800">Rating</div>
                                            <div className="font-bold text-gray-400 h-10 border-b dark:border-gray-800">Category</div>
                                            <div className="font-bold text-gray-400 h-10 border-b dark:border-gray-800">Stock</div>
                                            <div className="font-bold text-gray-400 h-10 border-b dark:border-gray-800">Action</div>
                                        </div>
                                        {compareList.map(p => (
                                            <div key={p.id} className="text-center relative">
                                                <button onClick={() => setCompareList(compareList.filter(i => i.id !== p.id))} className="absolute top-0 right-0 text-red-500 hover:bg-red-50 rounded-full p-1"><Icon name="trash" size={14} /></button>
                                                <img src={p.image} className="w-full h-40 object-cover rounded-xl mb-4 shadow-lg" />
                                                <h3 className="font-bold text-lg mb-2 truncate dark:text-white">{p.title}</h3>
                                                <div className="space-y-4">
                                                    <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center text-purple-600 font-bold">GH₵{p.price}</div>
                                                    <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center text-yellow-500">{'⭐'.repeat(p.rating)}</div>
                                                    <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center uppercase text-xs font-bold tracking-widest text-gray-900 dark:text-white">{p.category}</div>
                                                    <div className="h-10 border-b dark:border-gray-800 flex items-center justify-center text-sm text-gray-900 dark:text-white">{p.stock > 0 ? 'In Stock' : 'Out of Stock'}</div>
                                                    <div className="h-10 flex items-center justify-center pt-2">
                                                        <button onClick={() => { addToCart(p); setShowCompare(false); }} className="bg-black text-white px-6 py-2 rounded-full text-xs font-bold hover:scale-105 transition">Add to Cart</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )
                    }
                </div >
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdvancedEcommerce />);
    </script>
